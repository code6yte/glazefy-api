<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Menu — Glazefy</title>
  <link rel="stylesheet" href="/css/ar-menu.css">
  <!-- Google model-viewer for WebXR AR -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <div id="loading" class="loading-screen">
      <div class="spinner"></div>
      <p>Loading menu...</p>
    </div>

    <!-- Error -->
    <div id="error" class="error-screen hidden">
      <div class="error-icon">😕</div>
      <h2>Menu Not Found</h2>
      <p id="error-message">This business menu doesn't exist.</p>
    </div>

    <!-- Menu Content -->
    <div id="menu-content" class="hidden">
      <!-- Header -->
      <header class="menu-header">
        <div class="header-info">
          <h1 id="cafe-name"></h1>
          <p id="cafe-description"></p>
        </div>
      </header>

      <!-- Category Navigation -->
      <nav class="category-nav" id="category-nav"></nav>

      <!-- Menu Sections (grouped by category) -->
      <main id="menu-sections"></main>
    </div>

    <!-- AR Detail Modal -->
    <div id="ar-modal" class="modal-overlay hidden">
      <div class="item-detail">
        <button class="close-btn" id="modal-close">&times;</button>

        <!-- 3D Viewer (shown when model_3d_url exists) -->
        <div id="viewer-3d" class="viewer-container hidden">
          <model-viewer
            id="model-viewer"
            ar
            ar-modes="webxr scene-viewer quick-look"
            ar-scale="auto"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            environment-image="neutral"
            loading="eager"
            style="width: 100%; height: 300px; background: #0a0a1a;"
          >
            <button slot="ar-button" class="ar-launch-btn">
              📱 View in Your Space
            </button>
          </model-viewer>
        </div>

        <!-- Image fallback (shown when no 3D model) -->
        <div id="viewer-image" class="viewer-container hidden">
          <img id="detail-image" src="" alt="Product" class="detail-img">
        </div>

        <div class="detail-info">
          <h2 id="detail-name"></h2>
          <p id="detail-description" class="detail-desc"></p>
          <div class="detail-footer">
            <span id="detail-price" class="detail-price"></span>
            <span id="detail-category" class="detail-category"></span>
          </div>

          <!-- AR Launch button for 3D items -->
          <button id="launch-ar-btn" class="cta-ar-btn hidden">
            <span class="ar-icon">📱</span>
            View in AR — Place on Your Table
          </button>

          <!-- No 3D badge for image-only items -->
          <div id="no-ar-badge" class="no-ar-info hidden">
            <span>🖼️</span>
            <span>Image preview only — 3D coming soon</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/ar-menu.js"></script>
</body>
</html>
